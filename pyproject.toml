[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twitterfeel"
version = "0.2.0"
description = "Local emotion and sentiment research workspace with preserved forecasting experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
forecasting = ["tensorflow>=2.16,<2.18", "imbalanced-learn>=0.12", "zstandard>=0.22"]
reporting = ["reportlab>=4"]
dev = ["ruff>=0.6", "build>=1"]

[project.scripts]
twitterfeel = "twitterfeel.desktop.app:main"
twitterfeel-label = "twitterfeel.labeling.label_posts:main"
twitterfeel-setup-models = "twitterfeel.inference.setup_models:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twitterfeel*"]

[tool.setuptools.package-data]
"twitterfeel.desktop" = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/*.ico"]
"twitterfeel.labeling" = ["annotation_rubric.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with correctness checks without reformatting historical experiments.
select = ["E9", "F63", "F7", "F82"]
